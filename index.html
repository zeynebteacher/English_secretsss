
<!DOCTYPE html>
<html lang="az">
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Secret
</style>

body {
  font-family: Arial, sans-serif;
  background: #f4ede3;
  color: #49372c;
  margin: 0;
  padding: 20px;
  line-height: 1.6;
}

header {
  text-align: center;
  background: #e5d2bb;
  color: #49372c;
  padding: 30px 20px;
  border-radius: 18px;
  margin-bottom: 24px;
  box-shadow: 0 4px 12px rgba(73, 55, 44, 0.10);
}

h1 {
  font-size: 36px;
  font-weight: bold;
  letter-spacing: 1px;
  margin: 0 0 10px;
}

h2 {
  color: #73523d;
  margin-top: 0;
}

.card {
  background: #fffaf4;
  color: #49372c;
  padding: 24px;
  margin: 18px 0;
  border-radius: 18px;
  border: 1px solid #eadbc9;
  box-shadow: 0 5px 16px rgba(73, 55, 44, 0.08);
}

button {
  background: #73523d;
  color: #fffaf4;
  border: 1px solid #73523d;
  padding: 13px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  transition: background 0.2s ease;
}

button:hover {
  background: #5b3f2e;
  border-color: #5b3f2e;
}

input {
  box-sizing: border-box;
  padding: 12px 14px;
  width: 90%;
  margin: 8px 0;
  background: #fffdf9;
  color: #49372c;
  border: 1px solid #d9c3a5;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #73523d;
  box-shadow: 0 0 0 3px rgba(115, 82, 61, 0.12);
}

.option {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 10px 0;
  padding: 14px 16px;
  background: #f5eee4;
  color: #49372c;
  border: 1px solid #d9c3a5;
  border-radius: 12px;
  text-align: left;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  header {
    padding: 24px 14px;
  }

  h1 {
    font-size: 28px;
  }

  .card {
    padding: 18px;
  }

  input {
    width: 100%;
  }

</style> 
</head>
<body>

<header>
<h1>English Secret ✨</h1>
<p>Learn English. Test yourself. Improve every day!</p>
</header>

<div class="card">
<h2>Şagird girişi</h2>
<p>Adını daxil et və sınağa başla.</p>
<input id="studentName" placeholder="Ad və soyad">
<button onclick="startTest()">Sınağa başla</button>
</div>
  
<div class="card">
  <h2>Müəllim girişi</h2>
  <p>Materialları və testləri idarə et.</p>
  
<input id="teacherEmail" type="email" placeholder="Müəllim e-poçtu">

  <input id="teacherPassword" type="password" placeholder="Müəllim şifrəsi">
  <button onclick="teacherLogin()">Daxil ol</button>
  <p id="teacherMessage"></p>
</div>

<div class="card" id="teacherPanel" style="display:none;">
  <h2>Müəllim paneli</h2>
  <p>English Secret idarəetmə bölməsinə xoş gəlmisən!</p>
</div>


<div class="card" id="testBox" style="display:none;">
<h2>İngilis dili sınağı</h2>
<p id="question"></p>
<div id="answers"></div>
<p id="result"></p>
<button onclick="nextQuestion()">Növbəti sual</button>
</div>

<script>
const questions = [
{q:"Choose the correct answer: She ___ to school every day.", options:["go","goes","going","gone"], answer:1},
{q:"What is the plural of child?", options:["childs","childes","children","childrens"], answer:2},
{q:"Choose the synonym of happy.", options:["sad","glad","angry","tired"], answer:1},
{q:"They ___ watching TV now.", options:["is","am","are","be"], answer:2},
{q:"What is the opposite of difficult?", options:["easy","hard","strong","late"], answer:0}
];

let current = 0;
let score = 0;
let selected = false;

function startTest() {
  const name = document.getElementById("studentName").value.trim();
  if (!name) {
    alert("Zəhmət olmasa adını daxil et.");
    return;
  }
  document.getElementById("welcome");
  document.getElementById("testBox").style.display = "block";
  document.getElementById("studentName").disabled = true;
  document.getElementById("question").textContent =
  "Xoş gəlmisən, " + name + "!";
  current = 0;
  score = 0;
  showQuestion();
}

function showQuestion() {
  selected = false;
  document.getElementById("result").textContent = "";
  document.getElementById("studentName").disabled = true;
  if (current >= questions.length) {
    document.getElementById("question").textContent = "Sınaq tamamlandı!";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("result").textContent =
      "Nəticən: " + score + " / " + questions.length;
    return;
  }

  const q = questions[current];
  document.getElementById("question").textContent =
    (current + 1) + ". " + q.q;

  let html = "";
  q.options.forEach(function(option, index) {
    html += '<button class="option" onclick="checkAnswer(' + index + ')">' +
      option + '</button>';
  });
  document.getElementById("answers").innerHTML = html;
}

function checkAnswer(index) {
  if (selected) return;
  selected = true;

  if (index === questions[current].answer) {
    score++;
    document.getElementById("result").textContent = "Düzgün cavab! 🎉";
  } else {
    document.getElementById("result").textContent =
      "Səhv cavab. Düzgün cavab: " +
      questions[current].options[questions[current].answer];
  }
}

function nextQuestion() {
  if (current >= questions.length) return;
  if (!selected) {
    alert("Əvvəlcə cavab variantını seç.");
    return;
  }
  current++;
  showQuestion();
}
  
const supabaseClient = window.supabase.createClient(
  "https://ngnonuzopyeymgjoypkh.supabase.co",
  "BURAYA_PUBLISHABLE_KEY_YAZ"
);

async function teacherLogin() {
  const email = document.getElementById("teacherEmail").value.trim();
  const password = document.getElementById("teacherPassword").value;
  const message = document.getElementById("teacherMessage");

  message.textContent = "Giriş yoxlanılır...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Giriş alınmadı. E-poçtu və şifrəni yoxla.";
    return;
  }

  document.getElementById("teacherPanel").style.display = "block";
  message.textContent = "Müəllim girişi uğurludur!";
}

  
</script>

</body>
</html>
