let current = 0;
let score = 0;
let selected = false;

function startTest() {
  const name = document.getElementById("studentName").value.trim();
  if (!name) {
    alert("Zəhmət olmasa adını daxil et.");
    return;
  }
  document.getElementById("welcome");
  document.getElementById("testBox").style.display = "block";
  document.getElementById("studentName").disabled = true;
  document.getElementById("question").textContent =
  "Xoş gəlmisən, " + name + "!";
  current = 0;
  score = 0;
  showQuestion();
}

function showQuestion() {
  selected = false;

  document.getElementById("result").textContent = "";
  document.getElementById("studentName").disabled = true;

  if (current >= questions.length) {
    document.getElementById("question").textContent =
      "Sınaq tamamlandı! 🎉";

    document.getElementById("answers").innerHTML = "";

    document.getElementById("result").textContent =
      "Nəticən: " + score + " / " + questions.length;

    return;
  }

  const q = questions[current];

  document.getElementById("question").textContent =
    (current + 1) + ". " + q.q;

  let html = "";

  if (q.type === "open") {
    html =
      '<input id="openAnswer" type="text" ' +
      'placeholder="Cavabını buraya yaz" ' +
      'style="width:90%;padding:12px;margin:10px 0;">' +
      '<button onclick="checkOpenAnswer()">Cavabı yoxla</button>';
  } else {
    q.options.forEach(function(option, index) {
      html +=
        '<button class="option" onclick="checkAnswer(' + index + ')">' +
        option +
        '</button>';
    });
  }

  document.getElementById("answers").innerHTML = html;
}

function checkAnswer(index) {
  if (selected) return;

  selected = true;

  const q = questions[current];

  if (index === q.answer) {
    score++;

    document.getElementById("result").textContent =
      "Düzgün cavab! 🎉";
  } else {
    document.getElementById("result").textContent =
      "Səhv cavab. Düzgün cavab: " + q.options[q.answer];
  }
}

function checkOpenAnswer() {
  if (selected) return;

  const q = questions[current];
  const input = document.getElementById("openAnswer");

  const userAnswer = input.value
    .trim()
    .toLowerCase()
    .replace(/[.!?]/g, "")
    .replace(/\s+/g, " ");

  if (!userAnswer) {
    document.getElementById("result").textContent =
      "Zəhmət olmasa, cavabını yaz.";
    return;
  }

  selected = true;

  const acceptedAnswers = Array.isArray(q.answer)
    ? q.answer
    : [q.answer];

  const correct = acceptedAnswers.some(function(answer) {
    return userAnswer === String(answer)
      .trim()
      .toLowerCase()
      .replace(/[.!?]/g, "")
      .replace(/\s+/g, " ");
  });

  if (correct) {
    score++;

    document.getElementById("result").textContent =
      "Düzgün cavab! 🎉";
  } else {
    document.getElementById("result").textContent =
      "Cavab qəbul edilmədi. Nümunə cavab: " +
      acceptedAnswers[0];
  }
}

function nextQuestion() {
  if (current >= questions.length) return;

        ? "Əvvəlcə açıq sualın cavabını yaz və yoxla."
        : "Əvvəlcə cavab variantını seç."
    );
    return;
  }

  current++;
  showQuestion();
}

  async function resetPassword() {
  const email = document.getElementById("teacherEmail").value.trim();
  const message = document.getElementById("teacherMessage");

  if (!email) {
    message.textContent = "Əvvəlcə e-poçt ünvanını yaz.";
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });

  if (error) {
    message.textContent = "Xəta: " + error.message;
    return;
  }

  message.textContent = "Şifrə bərpası üçün e-poçtunu yoxla.";
}
